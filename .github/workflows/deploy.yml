name: Deploy

on:
  push:
    branches:
      - development
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    name: Deploy (dev)
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install infra dependencies
        run: cd infra && npm ci

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Deploy dev stack
        run: cd infra && npx cdk deploy Spotter-dev --require-approval never -c env=dev

  deploy-prod:
    name: Deploy (prod)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install infra dependencies
        run: cd infra && npm ci

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      # ALARM_EMAIL (repository secret) subscribes that address to the alarm topic.
      # Left unset, the stack deploys without a subscription, as before.
      - name: Deploy prod stack
        env:
          ALARM_EMAIL: ${{ secrets.ALARM_EMAIL }}
        run: cd infra && npx cdk deploy Spotter-prod --require-approval never -c env=prod -c "alarmEmail=$ALARM_EMAIL"
